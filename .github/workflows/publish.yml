name: Publish ACR package

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  publish:
    needs: tests
    permissions:
      contents: write
    uses: jbaruch/agentic-context-registry/.github/workflows/publish-package.yml@18793698a3c82594d225860d1aff5bf1441a7ae9 # v0.6.0
    with:
      acr-version: v0.6.0
